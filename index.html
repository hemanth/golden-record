    <!-- WebMCP: Immediate Model Context Protocol Tool Registration -->
    <script>
      (function () {
        function registerWebMcp() {
          var mc =
            (typeof navigator !== "undefined" && navigator.modelContext) ||
            (typeof document !== "undefined" && document.modelContext);
          if (!mc || typeof mc.registerTool !== "function" || window.__goldenRecordWebMcpBootstrapped) {
            return;
          }
          window.__goldenRecordWebMcpBootstrapped = true;
          var tools = [
            {
              name: "search_golden_record",
              title: "Search Voyager Golden Record Grooves",
              description:
                "Search or filter all 48 NASA Voyager Golden Record grooves (27 Music from Earth works across 19 countries + 21 Greetings & Sounds of Earth).",
              inputSchema: {
                type: "object",
                properties: {
                  query: { type: "string", description: "Country, composer, performer, title, or groove code" },
                  side: { type: "string", enum: ["all", "music", "sounds"] },
                  country: { type: "string", description: "Optional country filter (e.g. India, Peru, Japan, Senegal)" },
                  limit: { type: "number" }
                }
              },
              execute: async function (args) {
                if (window.__goldenRecordWebMcp && window.__goldenRecordWebMcp.search) {
                  return window.__goldenRecordWebMcp.search(args || {});
                }
                var qs = new URLSearchParams();
                if (args && args.query) qs.set("q", args.query);
                if (args && args.side) qs.set("side", args.side);
                if (args && args.country) qs.set("country", args.country);
                if (args && args.limit) qs.set("limit", String(args.limit));
                var res = await fetch("./api/tracks?" + qs.toString());
                return await res.json();
              }
            },
            {
              name: "play_golden_record_groove",
              title: "Drop Stylus on Golden Record Groove",
              description:
                "Physically drop the 3D diamond stylus onto a specific Voyager Golden Record groove ID or band code and start 16⅔ RPM playback.",
              inputSchema: {
                type: "object",
                properties: {
                  id: { type: "string", description: "Groove ID or band code (e.g. '01', '27', 'S01', 'music-26-india-jaat-kahan-ho')" },
                  intraBandRatio: { type: "number", description: "Optional 0..0.95 radial position within the groove" }
                },
                required: ["id"]
              },
              execute: async function (args) {
                if (window.__goldenRecordWebMcp && window.__goldenRecordWebMcp.playGroove) {
                  return window.__goldenRecordWebMcp.playGroove(args);
                }
                return { error: "Player UI still initializing" };
              }
            },
            {
              name: "set_plate_side",
              title: "Flip Golden Record Side or Cover Plate",
              description:
                "Flip the 3D 24k gold disc between Side 1 ('music'), Side 2 ('sounds'), or Frank Drake's engraved protective 'cover' plate.",
              inputSchema: {
                type: "object",
                properties: {
                  side: { type: "string", enum: ["music", "sounds", "cover"] }
                },
                required: ["side"]
              },
              execute: async function (args) {
                if (window.__goldenRecordWebMcp && window.__goldenRecordWebMcp.setSide) {
                  return window.__goldenRecordWebMcp.setSide(args);
                }
                return { error: "Player UI still initializing" };
              }
            },
            {
              name: "park_stylus",
              title: "Park Tonearm on Rest Cradle",
              description: "Lift the stylus off the Golden Record and park the tonearm onto its U-cradle rest post.",
              inputSchema: {
                type: "object",
                properties: {}
              },
              execute: async function () {
                if (window.__goldenRecordWebMcp && window.__goldenRecordWebMcp.parkStylus) {
                  return window.__goldenRecordWebMcp.parkStylus();
                }
                return { error: "Player UI still initializing" };
              }
            }
          ];
          for (var i = 0; i < tools.length; i++) {
            var t = tools[i];
            try {
              mc.registerTool({
                name: t.name,
                title: t.title,
                description: t.description,
                inputSchema: t.inputSchema,
                parameters: t.inputSchema,
                execute: t.execute,
                handler: t.execute
              });
            } catch (_e) {}
          }
        }
        registerWebMcp();
        if (typeof document !== "undefined") {
          document.addEventListener("DOMContentLoaded", registerWebMcp, { once: true });
        }
      })();
    </script>
